<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Custom Mapbox UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Mapbox -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js"></script>
    <link rel="stylesheet" href="./styles/main.css" />
    <script src="./scripts/main.js" defer></script>
    <script src="./scripts/map-overlay.js" defer></script>
</head>

<body>
    <div class="main-layout-row">
        <div class="main-content-col">
            <div class="map-card" id="mapCard">
                <div id="map"></div>

                <!-- Top right controls -->
                 <div class="map-ui" data-map-id="main">
                <div class="top-controls">
                    <div class="map-type-btn-gap">
                        <button class="btn active" onclick="setMapStyle('streets', this)" aria-label="Switch to map view">
                            Map
                        </button>
                        <button class="btn" onclick="setMapStyle('satellite', this)" aria-label="Switch to satellite view">
                            Satellite
                        </button>
                    </div>

                    <div class="map-zoom-btn-gap">
                        <button class="btn" onclick="map.zoomOut()" aria-label="Zoom out">−</button>
                        <button class="btn" onclick="map.zoomIn()" aria-label="Zoom in">+</button>
                    </div>
                </div>
                <button class="map-filters-toggle" type="button" onclick="toggleMapFilters()" aria-label="Toggle map filters">
                    + Map Filters
                </button>
                <div class="bottom-controls">
                    <button class="pill" type="button" data-type="food" role="tab" aria-selected="false" aria-label="Food places filter">
                        <img src="./assets/icons/food.svg" alt="" class="pill-icon" />
                        <span>Food</span>
                    </button>

                    <button class="pill" type="button" data-type="transport" role="tab" aria-selected="false" aria-label="Transport places filter">
                        <img src="./assets/icons/transport.svg" alt="" class="pill-icon" />
                        <span>Transport</span>
                    </button>

                    <button class="pill" type="button" data-type="amenities" role="tab" aria-selected="false" aria-label="Amenities places filter">
                        <img src="./assets/icons/amenities.svg" alt="" class="pill-icon" />
                        <span>Amenities</span>
                    </button>
                </div>
                </div>
            </div>
            <div>
                <button class="pill js-open-map" type="button" data-type="Open Map" role="tab" aria-selected="false" aria-label="Open map view popup">
                    <span>Open map</span>
                </button>
            </div>
            <div class="nearby-routes-section">
                <h2 class="nearby-routes-title">Nearby Routes</h2>
                <div class="nearby-routes-list split-2" id="nearbyRoutes">
                </div>
            </div>
        </div>
        <div class="main-sidebar-col">
            -- right side content
        </div>
    </div>
    <!-- popup-modal -->
    <div class="modal" id="mapModal" aria-hidden="true">
        <div class="modal_overlay js-close-map"></div>
          <button
    class="modal-close-btn js-close-map"
    type="button"
    aria-label="Close map"
  >
    ✕
  </button>
        <div class="modal_content" role="dialog" aria-modal="true">
            <div class="modal_header">
            </div>

            <div class="modal_body">
                <div id="mapModalCanvas" class="mapbox-container"></div>
                <div class="top-controls-holder"></div>
            </div>
        </div>
    </div>
    <!-- ends -->
</body>

</html>
